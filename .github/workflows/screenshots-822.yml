name: Screenshots for 822
on:
  push:
    branches: [screenshots-822]
permissions:
  contents: read
jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        side: [before, after]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.side == 'before' && 'crmne/zapfast' || 'Ryankapa/zapfast' }}
          ref: ${{ matrix.side == 'before' && 'main' || 'emoji-picker-shortcut' }}
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libasound2-dev libpipewire-0.3-dev clang libclang-dev cmake perl xvfb mesa-utils libgl1-mesa-dri
      - run: cargo build --locked --features demo
      - name: Capture
        shell: bash
        run: |
          run() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1600x1200x24" "$@"; else "$@"; fi; }
          for theme in dark light; do
            page=shortcuts; [ $theme = light ] && page=shortcuts,light
            run target/debug/zapfast --demo-page "$page" --demo-size 1200x900 --demo-shot "$RUNNER_TEMP/${{ matrix.os }}-${{ matrix.side }}-$theme.png" --demo-shot-delay 4000 || true
          done
          ls -la "$RUNNER_TEMP"/*.png
      - uses: actions/upload-artifact@v7
        with:
          name: shots-${{ matrix.os }}-${{ matrix.side }}
          path: ${{ runner.temp }}/*.png
